[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "marketpulse"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "httpx>=0.28,<1", "psycopg[binary]>=3.2,<4", "kafka-python>=2.2,<3"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.15,<2"]
spark = ["pyspark==4.0.4"]
snowflake = ["snowflake-connector-python>=3.14,<5"]
[project.scripts]
marketpulse = "marketpulse.cli:main"
[tool.hatch.build.targets.wheel]
packages = ["marketpulse", "services"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
